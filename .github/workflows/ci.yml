name: CI

on:
  push:
    branches: [main, staging, ayisha-FE, sofia-FE]
  pull_request:
    branches: [main, staging]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Lint, Build & Test
    runs-on: ubuntu-latest

    env:
      NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL || 'http://localhost:6002' }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://placeholder.supabase.co' }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'ci-supabase-anon-key' }}
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY || 'pk_test_ci_dummy_key' }}
      NEXT_PUBLIC_MAPBOX_TOKEN: ${{ secrets.NEXT_PUBLIC_MAPBOX_TOKEN || 'pk.ci_dummy_mapbox_token' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Cache node_modules
        id: node-modules-cache
        uses: actions/cache@v4
        with:
          path: node_modules
          # `setup-node`'s `cache: pnpm` above only caches the pnpm content-store
          # (skips re-downloading packages); pnpm still re-links the whole tree
          # into node_modules every run. Caching node_modules itself, keyed on
          # both lockfile and package.json (since install runs with
          # --no-frozen-lockfile, so the lockfile alone isn't a reliable enough
          # key if package.json drifted), turns a hit into pnpm just verifying an
          # already-correct tree instead of a full reinstall.
          key: ${{ runner.os }}-node-modules-${{ hashFiles('**/pnpm-lock.yaml', '**/package.json') }}

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/.next/cache
          # Scoped to src/** (and the root configs the build actually reads) rather
          # than a repo-wide **/*.js glob: that glob ran after `pnpm install` and
          # was hashing every file under node_modules too — hundreds of thousands
          # of vendor files that have nothing to do with app source, which made
          # the exact key slow to compute and unstable between otherwise-identical
          # runs, so nearly every build fell through to the restore-keys fallback
          # instead of an exact cache hit.
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/pnpm-lock.yaml') }}-${{ hashFiles('src/**/*.js', 'src/**/*.jsx', 'src/**/*.ts', 'src/**/*.tsx', 'next.config.mjs', 'tsconfig.json', 'tailwind.config.*') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/pnpm-lock.yaml') }}-

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test --run
